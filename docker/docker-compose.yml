# Helo relay deployment.
#
# The zero-trust property is preserved here: the relay container has no key
# material, and the reverse proxy terminates TLS without ever seeing plaintext
# messages -- it sees ciphertext envelopes, exactly as the relay does.

services:
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8443
      HOST: 0.0.0.0
      DB_PATH: /data/helo.db
    volumes:
      - relay-data:/data
    # Hardening: the container cannot write outside /data, cannot gain
    # privileges, and drops every Linux capability. A relay compromise
    # therefore yields metadata, not a foothold for privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks: [internal]
    expose: ["8443"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks: [internal, public]

volumes:
  relay-data:
  caddy-data:
  caddy-config:

networks:
  # The relay is NOT on the public network. Only the proxy is reachable.
  internal:
    internal: true
  public:
