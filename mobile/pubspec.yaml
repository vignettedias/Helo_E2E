name: helo
description: >
  Helo — end-to-end encrypted messaging. Classical X3DH + Double Ratchet with
  an untrusted ciphertext relay. NOT post-quantum secure.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Audited cryptographic primitives. No primitive is implemented by hand in
  # this project; see lib/crypto/primitives.dart.
  cryptography: ^2.7.0

  # Hardware-backed key storage: Android Keystore / iOS Keychain. Session
  # state and message history are sealed with AES-256-GCM under a key held
  # here before they are stored (see SessionManager), so no separate encrypted
  # database dependency is needed.
  flutter_secure_storage: ^9.2.2

  qr_flutter: ^4.1.0       # QR display for safety-number verification
  http: ^1.2.2
  pqcrypto: ^0.4.3
  file_picker: ^11.0.3
  zxing2: ^0.2.4
  image: ^4.12.0
  camera: ^0.12.1
  video_player: ^2.14.1
  record: ^7.1.2
  path_provider: ^2.1.6
  web: ^1.1.1
  cross_file: ^0.3.5+5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  qr: 3.0.2

flutter:
  uses-material-design: true
  # The cross-implementation vectors (../tests/vectors/helo_vectors.json) are
  # read from disk by test/vector_conformance_test.dart. They are deliberately
  # NOT bundled as an asset: they contain fixed-seed test private keys, which
  # have no business shipping inside the app.
