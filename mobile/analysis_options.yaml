include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Security-relevant lints are errors, not suggestions.
    avoid_print: error
    unawaited_futures: error
    close_sinks: error

linter:
  rules:
    - prefer_final_locals
    - prefer_const_constructors
    - always_declare_return_types
    - avoid_dynamic_calls
    - only_throw_errors
    - throw_in_finally
