
name: Build Helo Web Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build web application
        working-directory: mobile
        run: flutter build web --release

      - name: Check the media plugins are in the build
        # Without these, photos, videos, files and voice messages fail in the
        # browser (a stale plugin registrant once produced such a build).
        run: |
          grep -q "__file_picker_web-file-input" mobile/build/web/main.dart.js
          grep -q "record.worklet.js" mobile/build/web/main.dart.js

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: helo-web-build
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 7
