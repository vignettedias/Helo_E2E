name: Build Helo Android APK

# Run by hand: Actions -> "Build Helo Android APK" -> Run workflow.
# GitHub's runners ship the Android SDK, so no local SDK is needed.
#
# The APK is signed with Flutter's DEBUG key (android/app/build.gradle.kts
# still uses signingConfigs.debug). That is enough to sideload it for a demo
# and is NOT suitable for distribution: anyone can produce an APK with the
# same signature. Publishing would need a real upload key.
on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: 'Relay the app should use (blank = ask on first run, e.g. http://192.168.1.20:8443)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Dart suite starts the real relay (backend/src/server.js).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: flutter test

      - name: Build APK
        working-directory: mobile
        run: |
          if [ -n "${{ inputs.relay_url }}" ]; then
            flutter build apk --release --dart-define=HELO_RELAY_URL='${{ inputs.relay_url }}'
          else
            flutter build apk --release
          fi

      - name: Report size
        run: ls -lh mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the APK
        uses: actions/upload-artifact@v4
        with:
          name: helo-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
